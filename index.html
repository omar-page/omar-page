<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eng. Omar</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#1a1a1a; --muted:#6b7280;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111214; --card:#1c1e22; --text:#f2f2f2; --muted:#9aa0a6;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111214; --card:#1c1e22; --text:#f2f2f2; --muted:#9aa0a6;
  }
  html,body{height:100%;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--card); border-radius:24px; padding:36px 28px;
    max-width:380px; width:100%; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
  }
  .avatar{
    width:84px; height:84px; border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex; align-items:center; justify-content:center;
    color:white; font-size:34px; font-weight:700; margin:0 auto 16px;
  }
  h1{ font-size:24px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:14px; margin-bottom:28px; }
  .icon-row{ display:flex; justify-content:center; gap:22px; margin-bottom:8px; }
  .icon-btn{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:none; border:none; cursor:pointer; color:var(--text);
    font-family:inherit; font-size:13px; font-weight:600;
    padding:0;
  }
  .icon-btn img.icon{
    width:60px; height:60px; display:block;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    border-radius:15px;
  }
  .icon-btn.active img.icon{ transform:scale(1.08); box-shadow:0 0 0 3px rgba(37,99,235,0.35); }
  .icon-btn:active img.icon{ transform:scale(0.95); }
  .qr-area{ margin-top:24px; }
  .qr-item{
    display:none; background:rgba(120,120,120,0.06); border-radius:18px; padding:20px;
    animation:fadeIn 0.2s ease;
  }
  .qr-item.show{ display:block; }
  .qr-item img.qr{ width:100%; max-width:230px; height:auto; border-radius:10px; background:#fff; padding:8px; }
  .qr-label{ margin-top:12px; font-weight:600; font-size:15px; }
  .hint{ color:var(--muted); font-size:13px; margin-top:20px; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>

  <script>
    function toggleQR(btn) {
      var targetId = btn.getAttribute('data-target');
      var alreadyActive = btn.classList.contains('active');
      document.querySelectorAll('.icon-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.qr-item').forEach(function(el) { el.classList.remove('show'); });
      var hint = document.getElementById('hint');
      if (!alreadyActive) {
        btn.classList.add('active');
        document.getElementById(targetId).classList.add('show');
        hint.style.display = 'none';
      } else {
        hint.style.display = 'block';
      }
    }
  </script>
